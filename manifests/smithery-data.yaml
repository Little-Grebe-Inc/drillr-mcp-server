name: drillr-data
displayName: drillr — financial data and research MCP
description: |
  drillr's financial data and research MCP for AI agents. Ten tools: resolve
  names to tickers, discover companies by description, list and search a
  company's filings (structured as-reported facts plus the filed text), run
  read-only SQL over the financial, price, earnings, ownership, analyst,
  event and executive tables, and pull research signals from earnings calls
  and news. US, China and Japan; every figure traced to its filing.
homepage: https://drillr.ai
repository: https://github.com/Little-Grebe-Inc/drillr-mcp-server
license: MIT
runtime: http
endpoint: https://gateway.drillr.ai/mcp/data
tags: [finance, sec-filings, financial-data, equity-research, sql]
config:
  headers:
    Authorization:
      description: >-
        Optional. Leave empty to sign in through the browser (OAuth). Only needed
        for hosts without OAuth support — get a key at drillr.ai/account/api-keys?ref=mp_smithery
      required: false
icon: https://raw.githubusercontent.com/Little-Grebe-Inc/drillr-mcp-server/main/docs/images/icon.png
screenshots:
  - https://raw.githubusercontent.com/Little-Grebe-Inc/drillr-mcp-server/main/docs/images/hero.gif
