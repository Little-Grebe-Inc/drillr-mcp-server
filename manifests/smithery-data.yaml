name: drillr-data
displayName: Drillr Data — financial data backend
description: |
  Drillr's 9-tool data backend for AI agents. SQL over 90+ standardized
  financial tables (statements, ratios, earnings, insider, ownership,
  prices), semantic news search, company-filing search, and 24 alt-data
  categories. Core equity coverage spans the US, Japan, Hong Kong, and
  China A-shares, with fundamentals back to the 1980s.
homepage: https://drillr.ai
repository: https://github.com/Little-Grebe-Inc/drillr-mcp-server
license: MIT
runtime: http
endpoint: https://gateway.drillr.ai/mcp/data
tags: [finance, sec-filings, alternative-data, sql, llm-native]
config:
  headers:
    Authorization:
      description: >-
        Optional. Leave empty to sign in through the browser (OAuth). Only needed
        for hosts without OAuth support — get a key at drillr.ai/developer/keys?ref=mp_smithery
      required: false
icon: https://raw.githubusercontent.com/Little-Grebe-Inc/drillr-mcp-server/main/docs/images/icon.png
screenshots:
  - https://raw.githubusercontent.com/Little-Grebe-Inc/drillr-mcp-server/main/docs/images/hero.gif
